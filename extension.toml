id = "highlight"
name = "Highlight"
version = "0.1.1-alpha"
authors = ["Marco Ivaldi <raptor@0xdeadbeef.info>"]
description = "Highlight all occurrences of selected words with multiple colors to quickly identify them in code."
repository = "https://github.com/0xdea/zed-highlight"
schema_version = 1

[language_servers.zed-highlight-lsp]
name = "Highlight LSP"
languages = [
    "Bash",
    "C",
    "C++",
    "CSharp",
    "CSS",
    "Diff",
    "Dockerfile",
