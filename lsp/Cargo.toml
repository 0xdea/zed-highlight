[package]
name = "zed-highlight-lsp"
description = "An LSP implemented for Zed that allows to highlight all occurrences of selected words."
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time", "io-std"] }
serde_json = "1.0"
regex = "1.12"

[dev-dependencies]
tower = "0.5" # tower-lsp depends on this version of tower

[[bin]]
name = "zed-highlight-lsp"
path = "src/main.rs"

# duplicated from the workspace root, as this crate is also published standalone to crates.io
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = false

[lints]
workspace = true
