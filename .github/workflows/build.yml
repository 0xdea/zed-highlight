name: build

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  build-linux-plus-checks:
    name: build-linux-plus-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
          cache-directories: ~/.cargo/advisory-db
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache health check
        shell: bash
        run: |
          if err=$(sccache --start-server 2>&1 >/dev/null); then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "$err"
            echo "::warning::sccache unavailable, building without cache: ${err%%$'\n'*}"
          fi
      - name: rustfmt
        run: cargo fmt --all --check
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: install cargo-audit
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - name: audit
        run: cargo audit
      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: test
        run: cargo test --workspace --locked
      - name: wasm-target
        run: rustup target add wasm32-wasip2
      - name: build-extension-wasm
        run: cargo build --locked --target wasm32-wasip2 -p zed-highlight

  build-macos:
    name: build-macos
    runs-on: macOS-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache health check
        shell: bash
        run: |
          if err=$(sccache --start-server 2>&1 >/dev/null); then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "$err"
            echo "::warning::sccache unavailable, building without cache: ${err%%$'\n'*}"
          fi
      - name: test
        run: cargo test --workspace --locked
      - name: build
        run: cargo build --workspace --locked
      - name: wasm-target
        run: rustup target add wasm32-wasip2
      - name: build-extension-wasm
        run: cargo build --locked --target wasm32-wasip2 -p zed-highlight

  build-windows:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: sccache health check
        shell: bash
        run: |
          if err=$(sccache --start-server 2>&1 >/dev/null); then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "$err"
            echo "::warning::sccache unavailable, building without cache: ${err%%$'\n'*}"
          fi
      - name: test
        run: cargo test --workspace --locked
      - name: build
        run: cargo build --workspace --locked
      - name: wasm-target
        run: rustup target add wasm32-wasip2
      - name: build-extension-wasm
        run: cargo build --locked --target wasm32-wasip2 -p zed-highlight

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
