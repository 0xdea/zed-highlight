name: release

# permissions:
#   contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-all:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: zed-highlight-lsp-darwin-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            asset: zed-highlight-lsp-darwin-x86_64.tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: zed-highlight-lsp-linux-aarch64.tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: zed-highlight-lsp-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          # aarch64 cross-compilation needs the gcc cross toolchain.
          if [[ "${{ matrix.target }}" == "aarch64-*" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi
      - name: build
        run: cargo build --release --manifest-path lsp/Cargo.toml --target ${{ matrix.target }}
      - name: package
        run: |
          cd lsp/target/${{ matrix.target }}/release
          tar czf "${{ matrix.asset }}" zed-highlight-lsp
          mv "${{ matrix.asset }}" ../../../../
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: release
    needs: build-all
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: publisn
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: "*.tar.gz"
          generate_release_notes: true
