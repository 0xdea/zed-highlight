name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-all:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: zed-highlight-lsp-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: zed-highlight-lsp-linux-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macOS-latest
            name: zed-highlight-lsp-darwin-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macOS-latest
            name: zed-highlight-lsp-darwin-aarch64.tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: zed-highlight-lsp-windows-x86_64.tar.gz

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: zed-highlight-lsp-windows-aarch64.tar.gz

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: build
        if: matrix.os != 'ubuntu-latest'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cargo build --release --locked --manifest-path lsp/Cargo.toml --target "$TARGET"
      - name: dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cross
      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cross build --release --locked --manifest-path lsp/Cargo.toml --target "$TARGET"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        shell: bash
        run: |
          cd "target/$TARGET/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar czf "../../../$NAME" zed-highlight-lsp.exe
          else
            tar czf "../../../$NAME" zed-highlight-lsp
          fi
      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: release
    needs: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the github release and upload assets
    steps:
      - name: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: publish # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
