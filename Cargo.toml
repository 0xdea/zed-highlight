[package]
name = "zed-highlight"
version = "0.1.4"
authors = ["Marco Ivaldi <raptor@0xdeadbeef.info>"]
edition = "2024"
description = "A Zed extension that allows to highlight all occurrences of selected words."
homepage = "https://0xdeadbeef.info/"
repository = "https://github.com/0xdea/zed-highlight"
license = "MIT"
keywords = ["zed", "zed-extension", "lsp-server", "vuln-dev", "code-review"]
categories = ["security", "development-tools", "text-editors"]
publish = false

[dependencies]
zed_extension_api = "0.7"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = false

[lints]
workspace = true

[workspace]
members = ["lsp"]
resolver = "2"

[workspace.lints.rust]
missing_docs = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# allow some lints
blanket_clippy_restriction_lints = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
arbitrary_source_item_ordering = "allow"
implicit_return = "allow"
question_mark_used = "allow"
print_stdout = "allow"
print_stderr = "allow"
min_ident_chars = "allow"
single_char_lifetime_names = "allow"
impl_trait_in_params = "allow"
missing_inline_in_public_items = "allow"
inline_modules = "allow"
single_call_fn = "allow"
separated_literal_suffix = "allow"
use_debug = "allow"
string_slice = "allow"
indexing_slicing = "allow"
multiple_crate_versions = "allow"
